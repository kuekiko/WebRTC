name: WebRTC iOS Static Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'WebRTC branch (e.g., master or branch-heads/6167)'
        required: true
        default: 'branch-heads/0000'
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Build WebRTC static library
        working-directory: src
        run: |
          # 清理前一次 artefact
          rm -rf scripts/out
          # 调用编译脚本
          IOS=true \
          BRANCH=${{ inputs.branch }} \
          BUILD_VP9=true \
          sh scripts/build_ios_static.sh

      - name: Upload libwebrtc.a
        uses: actions/upload-artifact@v4
        with:
          name: libwebrtc.a
          path: src/out/libwebrtc.a