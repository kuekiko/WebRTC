name: WebRTC iOS Static Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'WebRTC branch (e.g., master or branch-heads/6167)'
        required: true
        default: 'branch-heads/0000'
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Build WebRTC static library
        env:
          BRANCH: ${{ inputs.branch }}
          IOS: true
          BUILD_VP9: true
        run: |
          # 运行脚本（脚本内部会进入 src/ 并检出分支、sync、build）
          sh scripts/build_ios_static.sh

      - name: Upload libwebrtc.a
        uses: actions/upload-artifact@v4
        with:
          name: libwebrtc.a
          path: src/out/libwebrtc.a