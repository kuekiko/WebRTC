name: Build WebRTC iOS Static (arm64)

on:
  push:
    tags:
      - 'v*'  # 每当推送一个版本标签时触发

jobs:
  build:
    runs-on: macos-latest  # 使用最新的 macOS 环境

    steps:
    # Step 1: Checkout the code from repository
    - name: Checkout code
      uses: actions/checkout@v2

    # Step 2: Set up dependencies (installing depot_tools, etc.)
    - name: Set up depot_tools
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
        export PATH=$(pwd)/depot_tools:$PATH
        echo "Depot tools set up complete."

    # Step 3: Fetch WebRTC
    - name: Fetch WebRTC
      run: |
        fetch --nohooks webrtc_ios
        cd src
        git fetch --all
        git checkout main  # 选择你需要的分支，例如 main 或其他
        gclient sync --with_branch_heads --with_tags
        cd ..

    # Step 4: Configure and Build WebRTC
    - name: Configure and build WebRTC for iOS arm64
      run: |
        cd src
        export GN_DEFINES="is_debug=false rtc_build_framework=false rtc_build_examples=false rtc_enable_objc_symbol_export=true rtc_libvpx_build_vp9=true"
        gn gen out/ios-arm64 --args="target_os=\"ios\" target_cpu=\"arm64\" ios_deployment_target=\"12.0\" is_component_build=false rtc_build_framework=false rtc_build_tests=false rtc_include_tests=false"
        ninja -C out/ios-arm64 webrtc

    # Step 5: Prepare the iOS static library for upload
    - name: Package WebRTC Static Library
      run: |
        mkdir -p out/ios-arm64/WebRTC.framework/Headers
        cp out/ios-arm64/obj/libwebrtc.a out/ios-arm64/WebRTC.framework/WebRTC
        cp -R src/sdk/objc/api/include/* out/ios-arm64/WebRTC.framework/Headers/
        cat > out/ios-arm64/WebRTC.framework/Info.plist <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleIdentifier</key>
            <string>org.webrtc.WebRTC</string>
            <key>CFBundleName</key>
            <string>WebRTC</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
            <key>CFBundlePackageType</key>
            <string>FMWK</string>
        </dict>
        </plist>
        EOF

        # Step 6: Create a zip file for the framework
        cd out/ios-arm64
        zip -r WebRTC.framework.zip WebRTC.framework

    # Step 7: Upload the static WebRTC framework to GitHub Release
    - name: Upload WebRTC Static Library to GitHub Release
      uses: gh-actions/gha-release@v1
      with:
        files: out/ios-arm64/WebRTC.framework.zip
        tag_name: ${{ github.ref }}  # 使用当前的 GitHub 标签作为发布的版本
        release_name: "WebRTC iOS Static Framework"
        body: "This release includes the WebRTC iOS static framework for arm64 architecture."
