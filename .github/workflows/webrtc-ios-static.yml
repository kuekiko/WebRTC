# .github/workflows/webrtc-ios-static.yml
name: WebRTC iOS Static Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'WebRTC branch (e.g., master or branch-heads/6167)'
        required: true
        default: 'branch-heads/0000'
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Build WebRTC static library
        working-directory: src
        env:
          BRANCH: ${{ inputs.branch }}
          IOS: true
          BUILD_VP9: true
        run: |
          # 清理上次产物
          rm -rf scripts/out
          # 切到分支
          cd src
          fetch --nohooks webrtc_ios
          git fetch --all
          git checkout "$BRANCH"
          cd ..
          gclient sync --with_branch_heads --with_tags
          # 调用脚本
          IOS=true BRANCH="$BRANCH" BUILD_VP9=true sh scripts/build_ios_static.sh

      - name: Upload libwebrtc.a
        uses: actions/upload-artifact@v4
        with:
          name: libwebrtc.a
          path: src/out/libwebrtc.a